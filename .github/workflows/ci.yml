name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-tests:
    name: Domaine sur Linux (rapide)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4

      - name: Compiler et tester le domaine
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log

      - name: Résumé des erreurs
        if: failure()
        shell: bash
        run: |
          {
            echo '### Erreurs du domaine (Linux)'
            echo '```'
            grep -E "error:|XCTAssert|failed" swift-test.log | sort -u | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  app-build:
    name: App complète sur macOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write          # nécessaire pour publier dans une release
    strategy:
      fail-fast: false         # un type de Mac en panne de capacité n'arrête pas l'autre
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Choisir un simulateur iPhone
        id: sim
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Simulateur retenu : $DEVICE_ID"

      - name: Compiler l'app
        id: build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build -project AppSport.xcodeproj -scheme AppSport \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Lancer les tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test -project AppSport.xcodeproj -scheme AppSport \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log

      - name: Captures d'écran de l'app
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p screenshots
          ID="${{ steps.sim.outputs.id }}"
          APP=build/Build/Products/Debug-iphonesimulator/AppSport.app
          xcrun simctl boot "$ID" || true
          xcrun simctl bootstatus "$ID" -b
          xcrun simctl install "$ID" "$APP"
          shot() {
            xcrun simctl launch "$ID" io.github.hdrieuxafk.appsport "${@:2}"
            sleep 6
            xcrun simctl io "$ID" screenshot "screenshots/$1.png"
            xcrun simctl terminate "$ID" io.github.hdrieuxafk.appsport || true
          }
          shot 1_onboarding
          shot 1b_plan_propose -resetPlan YES -demoDraft YES
          shot 2_aujourdhui -selectedTab 0 -demo YES
          shot 3_plan -selectedTab 1
          shot 4_profil -selectedTab 2
          for p in 0 1 2; do shot "5_guide_clair_$p" -styleguide YES -guidePage $p; done
          xcrun simctl ui "$ID" appearance dark
          for p in 0 1 2; do shot "6_guide_sombre_$p" -styleguide YES -guidePage $p; done
          xcrun simctl ui "$ID" appearance light

      - name: Diagnostic du lancement avec un plan proposé
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p diag
          ID="${{ steps.sim.outputs.id }}"
          BID=io.github.hdrieuxafk.appsport
          xcrun simctl terminate "$ID" "$BID" || true
          rm -f ~/Library/Logs/DiagnosticReports/*AppSport* 2>/dev/null || true
          (xcrun simctl launch --console "$ID" "$BID" -resetPlan YES -demoDraft YES > diag/console.txt 2>&1 &)
          sleep 4
          xcrun simctl io "$ID" screenshot diag/apres_4s.png || true
          sleep 8
          xcrun simctl io "$ID" screenshot diag/apres_12s.png || true
          xcrun simctl spawn "$ID" log show --last 2m --style compact --predicate 'process == "AppSport"' 2>/dev/null | tail -150 > diag/journal.txt || true
          xcrun simctl terminate "$ID" "$BID" || true
          cp ~/Library/Logs/DiagnosticReports/*AppSport* diag/ 2>/dev/null || true
          ls -la diag

      - name: Construire le fichier à installer sur iPhone (IPA non signé)
        id: ipa
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive -project AppSport.xcodeproj -scheme AppSport \
            -destination "generic/platform=iOS" \
            -archivePath build/AppSport.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee archive.log
          mkdir -p ipa/Payload
          cp -R build/AppSport.xcarchive/Products/Applications/AppSport.app ipa/Payload/
          (cd ipa && zip -qry AppSport.ipa Payload)
          ls -la ipa

      - name: Publier l'IPA
        if: ${{ always() && steps.ipa.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: AppSport-ipa-${{ matrix.os }}
          path: ipa/AppSport.ipa

      - name: Résumé des erreurs
        if: ${{ failure() || steps.ipa.outcome == 'failure' }}
        shell: bash
        run: |
          {
            echo '### Erreurs de compilation, de test ou de fabrication de l'\''IPA'
            echo '```'
            grep -hE "error:|Test Case .* failed|XCTAssert" build.log test.log archive.log 2>/dev/null | sort -u | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier les captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-ecran-${{ matrix.os }}
          path: screenshots
          if-no-files-found: ignore

      - name: Publier dans la release build-latest
        if: ${{ always() && steps.ipa.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG=build-latest
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Dernière compilation" --notes "Fichiers produits automatiquement par la CI : IPA non signé et captures d'écran." || true
          cp ipa/AppSport.ipa "ipa/AppSport-${{ matrix.os }}.ipa"
          gh release upload "$TAG" "ipa/AppSport-${{ matrix.os }}.ipa" --clobber
          if ls screenshots/*.png >/dev/null 2>&1; then
            for f in screenshots/*.png; do cp "$f" "screenshots/${{ matrix.os }}_$(basename "$f")"; done
            gh release upload "$TAG" screenshots/${{ matrix.os }}_*.png --clobber
          fi
          if ls diag/* >/dev/null 2>&1; then
            mkdir -p reldiag
            for f in diag/*; do cp "$f" "reldiag/${{ matrix.os }}_diag_$(basename "$f")"; done
            gh release upload "$TAG" reldiag/* --clobber
          fi
